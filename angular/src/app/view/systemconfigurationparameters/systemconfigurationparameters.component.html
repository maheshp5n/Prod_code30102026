<div class="m-card">
    <div class="m-card-title">
        <a class="m-card-menue" [routerLink]="['/systemConfigurationParameters','template']" [routerLinkActive]="'m-card-menue-selected'">Template</a>
        <div class="m-card-menue-spacer"></div>
        <a class="m-card-menue" [routerLink]="['/systemConfigurationParameters','sms']" [routerLinkActive]="'m-card-menue-selected'"> SMS Server</a>
        <div class="m-card-menue-spacer"></div>
        <a class="m-card-menue" [routerLink]="['/systemConfigurationParameters','mail']" [routerLinkActive]="'m-card-menue-selected'">Mail Server</a>
        <div class="m-card-menue-spacer"></div>
        <a class="m-card-menue" (click)="false">{{currentdate|date:'dd-MMM-yy hh:mm:ss aa'}}</a>
    </div>
    <div class="clearfix"></div>
    <div style="margin: 10px 10px;">
       <router-outlet></router-outlet>
    </div>
    
</div>

<ngx-spinner size="medium" color="#fff" type="line-scale-party">
    <p style="font-size: 20px; color: rgb(255, 255, 255)">Loading...</p>
</ngx-spinner>
