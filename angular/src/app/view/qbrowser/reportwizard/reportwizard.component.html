<ngx-spinner size="medium" color="#fff" type="line-scale-party">
    <p style="font-size: 20px; color: rgb(255, 255, 255)">Loading...</p>
</ngx-spinner>

<div class="text-right">
    <button type="button" class="btn btn-sm btn-outline-primary" (click)="reportWizard.show()"><em
            class="fa fa-plus"></em> New </button>
</div>
<hr>
<div class="card-body" style="padding: 0px;">
<div class="wrap">
    <table class="head">
        <thead style="background-color:rgb(248, 245, 245)">
            <tr>
                
                <th >S.No.</th>
                <th >Report Name</th >
                <th >Report Description</th>
                <!-- <th class="table-header">Query</th> -->
                <th>Report Type</th>
                <th>Presentation Type</th>
                <!-- <th class="table-header">Action</th> -->
            </tr>
        </thead>
    </table>
 <div class="inner_table">
    <table>
      
        <tbody>
            <tr *ngFor="let w of wizards;let i=index;">
                
                <td >{{i+1}}.</td>
                <td ><a [routerLink]="['/reportdetails', w.id]"
                    [routerLinkActive]="'active'">{{w.reportName}}</a></td>
                <td >{{w.reportDescription}}</td>
                <!-- <td style="text-overflow: ellipsis;" class="queryColumn">
                    <code class="max-width:400px">{{w.reportQuery}}</code>
                </td> -->
                <td >{{w.reportType}}</td>
                <td >{{w.presentationType}}</td>
              
            </tr>
        </tbody>
    </table>
 </div>
</div>
</div>
