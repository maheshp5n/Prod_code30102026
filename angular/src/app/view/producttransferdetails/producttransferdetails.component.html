<ngx-spinner size="medium" color="#fff" type="line-scale-party">
    <p style="font-size: 20px; color: rgb(255, 255, 255)">Loading...</p>
</ngx-spinner>
<div class="card">
    <div class="card-header">
        <div class="row">
            <div class="col-md-4">
                <table style="width:100%">
                    <tr>
                        <td rowspan="2" style="width:35px">
                            <img alt="" style="width:100%;height:auto;background-color: #F88962;"
                                src="assets/images/product_transfer_120.png">
                        </td>
                        <td style="padding-left: 5px;">
                            Product Transfer
                        </td>
                    </tr>
                    <tr>
                        <td style="padding-left: 5px;">
                            <span style="font-size: 15px;font-weight: bold;">
                                {{productTransferDetails.manualId}}
                            </span>
                        </td>
                    </tr>
                </table>
            </div>
            <div class="col-md-8 text-right">
                <app-sapdocdisplay [crmDocNumber]="productTransferDetails.manualId">
                </app-sapdocdisplay>
                <button  class="btn btn-outline-info btn-sm" type="button" 
                (click)="confirmationPopup.show()">Packaging PDF</button>&nbsp;
            </div>
          
        </div>
    </div>

<div class="card">
    <div class="card-body" style="padding-bottom: 0px;">
        <ul class="menue">
            <li title="Details"><a [routerLink]="['details']" [routerLinkActive]="'active'">Details</a></li>
            <li title="Related"><a [routerLink]="['releated']" [routerLinkActive]="'active'">Related</a></li>
        </ul>
        <br>
        <hr style="margin-top:15px;">
    </div>
    <div class="card-body">
        <router-outlet></router-outlet>
    </div>
</div>

<!-- confirmation pop -->
<div class="modal fade" bsModal #confirmationPopup='bs-modal' [config]="{backdrop:'static'}" role="dialog">
    <div class="modal-dialog modal-md">
      <div class="modal-content" style="text-align: center;">
        <div class="modal-body">
          <div class="control-label">
            Do you want to procees with PDf Creation?
          </div>
          <br>
          <div class="col-md-5 col-sm-5">
            <button class="btn btn-md btn-success" style="border-radius: 2;" (click)="createPDF()">Yes
            </button>
          </div>
          <div class="col-md-2 col-sm-2"></div>
          <div class="col-md-5 col-sm-5">
            <button class="btn btn-md btn-danger" style="border-radius: 2;" (click)="confirmationPopup.hide()">No
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
