<div class="panel panel-default">
  
    <div class="panel-body">
      <div class="row">
          <div class="col-md-6 col-sm-6">
              <div class="row">
                <div class="col-md-12 form-group required">
                  <div class="control-label">
                    Type 
                  </div>
                  <select  class="form-control">
                      <!-- <option *ngFor="let o of _types" [ngValue]="o.type">{{o.type}}</option> -->
                      <option value="">--None--</option>
                      <option value="Mr.">Without Warrranty/AMC</option>
                      <option value="Ms.">Exceptional</option>
                      <option value="Mrs.">Installation</option>
                  </select>                
                </div>
              </div>
              
              <div class="row">
                  <div class="col-md-12 form-group required">
                    <div class="control-label">
                      Contact Name 
                    </div>
                    <input  type="text" class="form-control"              
                    style="font-family:Arial, FontAwesome" placeholder="&#xF002; Search Contacts...">                               
                  </div>
              </div>
  
              <div class="row">
                  <div class="col-md-12 form-group required">
                    <div class="control-label">
                      Status 
                    </div>
                    <select  class="form-control">
                        <!-- <option *ngFor="let o of _types" [ngValue]="o.type">{{o.type}}</option> -->
                        <option value="">--None--</option>
                        <option value="Mr.">New</option>
                        <option value="Ms.">In-Process</option>
                        <option value="Mrs.">Rejected</option>
                    </select>                
                  </div>
              </div>
  
              <div class="row">
                  <div class="col-md-12 form-group ">
                    <div class="control-label">
                      Case Origin  
                    </div>
                    <select  class="form-control">
                        <!-- <option *ngFor="let o of _types" [ngValue]="o.type">{{o.type}}</option> -->
                        <option value="">--None--</option>
                        <option value="Mr.">Email</option>
                        <option value="Ms.">Phone</option>
                        <option value="Mrs.">Web</option>
                    </select>                
                  </div>
              </div>               
             
              <div class="row">
                  <div class="col-md-12 form-group required">
                    <div class="control-label">
                      Account Name 
                    </div>
                    <input  type="text" class="form-control"              
                    style="font-family:Arial, FontAwesome" placeholder="&#xF002; Search Accounts...">                               
                  </div>
              </div>

              
          </div> 
  
          <div class="col-md-6 col-sm-6">
              <div class="row">
                  <div class="col-md-12 form-group required">
                    <div class="control-label">
                      Case Reason 
                    </div>
                    <select  class="form-control">
                        <!-- <option *ngFor="let o of _types" [ngValue]="o.type">{{o.type}}</option> -->
                        <option value="">--None--</option>
                        <option value="Mr.">Job Warrranty</option>
                        <option value="Ms.">Exceptional</option>
                        <option value="Mrs.">Upgradation</option>
                    </select>                
                  </div>
              </div>
  
              <div class="row">
                  <div class="col-md-12 form-group required">
                    <div class="control-label">
                      Call Center Rep Name 
                    </div>
                    <input  type="text" class="form-control"              
                    style="font-family:Arial, FontAwesome" placeholder="&#xF002; Search Contacts...">                               
                  </div>
              </div>
  
              <div class="row">
                  <div class="col-md-12 form-group required">
                    <div class="control-label">
                      Stage 
                    </div>
                    <select  class="form-control">
                        <!-- <option *ngFor="let o of _types" [ngValue]="o.type">{{o.type}}</option> -->
                        <option value="">--None--</option>
                        <option value="Mr.">Assigned to Engineer</option>
                        <option value="Ms.">Assigned to Dispatcher</option>
                        <option value="Mrs.">Work Order Received</option>
                    </select>                
                  </div>
              </div>
  
              <div class="row">
                  <div class="col-md-12 form-group required">
                    <div class="control-label">
                      Priority 
                    </div>
                    <select  class="form-control">
                        <!-- <option *ngFor="let o of _types" [ngValue]="o.type">{{o.type}}</option> -->
                        <option value="">--None--</option>
                        <option value="Mr.">High </option>
                        <option value="Ms.">Medium</option>
                        <option value="Mrs.">Low</option>
                    </select>                
                  </div>
              </div>
  
              <div class="row">
                  <div class="col-md-12 form-group ">
                    <div class="control-label">
                      Site ID 
                    </div>
                    <div class="">
                        00003327
                    </div>
                                   
                  </div>
              </div>               
                            
          </div>
      </div>
  
      <div class="row">
          <div class="col-md-12 form-group ">
            <div class="control-label">
              Service Center 
            </div>
            <input  type="text" class="form-control"              
            style="font-family:Arial, FontAwesome" placeholder="&#xF002; Search Legal Entity...">                               
          </div>
      </div>
  
      <div class="row">
          <div class="col-md-6 form-group ">
            <div class="row">
                <div class="col-md-12 form-group ">
            <div class="control-label">
              PO No 
            </div>
            <input type="date" class="form-control" >                
          </div>
          </div>
          </div>

          <div class="col-md-6 form-group ">
              <div class="row">
                  <div class="col-md-12 form-group ">
              <div class="control-label">
                PO Date 
              </div>
              <input type="date" class="form-control" >                
            </div>
            </div>
            </div>

      </div>
  
      <div class="row">
          <div class="col-md-12 form-group ">
            <div class="control-label">
              Remarks 
            </div>
            <textarea class="form-control" rows="3"></textarea>                
          </div>
      </div>
    </div>
  </div>
  
  <div class="panel-footer">
  <div class="row">
      <div class="col-md-12 text-right">
        <button type="button"  class="btn btn-primary">
          Cancel</button>&nbsp;
       <button type="button"  class="btn btn-primary"> Save
        </button>
      </div>
  </div>
