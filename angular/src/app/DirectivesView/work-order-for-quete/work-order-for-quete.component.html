<div class="panel panel-default" style="max-height: 75vh;overflow: auto;">
    

    <!-- <div class="panel-heading">
        <span class="text-center" style="font-weight: bold"> Customer PO And Invoice Detail </span>
    </div> -->
    <div class="panel-body">

        <div class="row">
            <div class="col-md-6 col-sm-6 form-group ">
                <div class="control-label">
                    Work Order Number
                </div>
                <input type="text" class="form-control"[(ngModel)]="quoteResponse.workOrderNumber">
            </div>
            <div class="col-md-6 col-sm-6 form-group ">
                <div class="control-label">
                    Work Order Date
                </div>
                <input class="form-control"onkeydown="return false" [(ngModel)]="quoteResponse.workOrderDate" bsDatepicker [bsConfig]="{ dateInputFormat: 'YYYY-MM-DD' }"
                    [maxDate]="today" [dateCustomClasses]="dateCustomClasses" autocomplete="off">&nbsp;
                <span class="fa fa-calendar errspan"></span>
            </div>
        </div>
        <!-- <div class="row">
            <div class="col-md-6 col-sm-6 form-group ">
                <div class="control-label">
                    Quete ID
                </div>
                <input type="text" class="form-control" [(ngModel)]="workOrderRequest.quoteId">
            </div>
        </div> -->



    </div>
   

</div>

<!--  // save and close button -->
<div class="row">
    <div class="col-md-12 text-right">
        <button type="button" (click)="workOrdercancelData()" class="btn btn-default"><i class="fa fa-remove"></i>
            Cancel</button>&nbsp;
        <button type="button" (click)="postworkOrrder()" class="btn btn-primary"><i class="fa fa-save"></i>
            Save
        </button>
    </div>
</div>


<div class="modal fade" bsModal #popupSuccessModel="bs-modal" [config]="{backdrop: 'static'}" tabindex="-1"
    role="dialog" aria-labelledby="create-product">

    <div [ngClass]="popupNgClass" style="width:40%; text-align: center">
        <button type="button" class="close pull-right" aria-label="Close" (click)="popupClose()">
            <span aria-hidden="true">&times;</span>
        </button>
        <strong *ngIf="message!='Updated Successfully'"> &nbsp;{{message}}!</strong>
        <strong *ngIf="message=='Updated Successfully'">&nbsp;{{message}} !</strong>

    </div>
</div>
