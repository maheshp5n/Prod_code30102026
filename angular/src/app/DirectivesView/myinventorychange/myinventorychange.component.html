<div class="row">
    <div class="col-3">
        <label>
            Partcode
        </label>
        <span class="form-control">{{_reqdata.partCode}}</span>
    </div>
    <div class="col-4">
        <label>Description</label>
        <p>{{_reqdata.productDescription}}</p>
    </div>
    <div class="col-3">
        <label>
            Serial Number
        </label>
        <span class="form-control">{{_reqdata.serialNumber}}</span>
    </div>
    <div class="col-2">
        <label>
            Status
        </label>
        <span class="form-control">{{getStatus(_reqdata.serialNumberStateId)}}</span>
    </div>
</div>
<hr>
<div class="row">
    <div class="col-3">
        <label>
            New Partcode
        </label>
        <ng-select *ngIf="searchREsult" [items]="searchREsult"
        [(ngModel)]="changeCode.part_code" bindLabel="productPartCode" bindValue="productPartCode" (search)="searchPartcode($event)"
        placeholder="Search Partcode...">
        <ng-template ng-label-tmp let-item="item">
            <img height="15" alt="" width="15" src='/assets/images/account_120.png'
                style="background-color: rgb(105, 241, 219);" /> {{item.productPartCode}}
        </ng-template>
        <ng-template ng-option-tmp let-item="item" let-index="index" let-search="searchTerm">
            <img height="15" alt="" width="15" src='/assets/images/account_120.png'
                style="background-color: rgb(105, 241, 219);" /> {{item.productPartCode}}
        </ng-template>
    </ng-select>
    </div>
    <div class="col-4">
        <label>Description</label>
        <p>{{getDescription()}}</p>
    </div>
    <div class="col-3">
        <label>
            New Serial Number
        </label>
        <input type="text" class="form-control" [(ngModel)]="changeCode.serial_number">
    </div>
    <div class="col-2">
        <label>
           New Status
        </label>
        <select class="form-control" [(ngModel)]="changeCode.state_id" [disabled]="currentUserDetails.roleGroupAndAccount.roleGroup!='DCT_MAIN_STORE'">
            <option value="0">--Select--</option>
            <option value="1">OK</option>
            <option value="2">Faulty</option>
            <option value="3">Scrap</option>
            <option value="4">Rejected</option>
            <option value="5">BER</option>
            <option value="6">DOA</option>
        </select>
        
    </div>
</div>
<div class="row">
    <div class="col-6">
        <label>
            Remark
        </label>
        <textarea rows="4" class="form-control" [(ngModel)]="changeCode.remark"></textarea>
    </div>
</div>
<hr>
<div class="row">
    <div class="col-12 text-right">
        <button type="button" class="btn btn-dark" (click)="saveData()"><em class="fa fa-save"></em> Save</button>
        <button type="button" class="btn btn-default" (click)="cancel()"><em class="fa fa-remove"></em> Cancel</button>
    </div>
</div>
<br>
