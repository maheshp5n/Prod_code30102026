<div class="card">
    <div class="card-body">
        <div style="max-height: 40vh;overflow: auto;">
            <table class="table table-sm">
                <thead>
                    <tr>
                        <th style="text-align: left;">
                            <input type="checkbox" [(ngModel)]="globalcheckbox" (change)="gloablCheckBoxEvent()">
                        </th>
                        <th>
                            Sl.NO
                        </th>
                        <th>
                            Service Order
                        </th>
                        <th>
                            Item Serial Number
                        </th>
                        <th>
                            Part code
                        </th>
                        <th>
                            Description
                        </th>
                        <th>
                            Customer Inventory
                        </th>
                        <th>
                            Warehouse
                        </th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let item of pendingItems;let i=index;">
                        <td>
                            <input type="checkbox" [(ngModel)]="item.selected">
                        </td>
                        <td>
                            {{i+1}}
                        </td>
                        <td>
                            {{item.serviceOrderId}}
                        </td>
                        <td>
                            {{item.itemSerialNumber}}
                        </td>
                        <td>
                            {{item.productPartCode}}
                        </td>
                        <td>
                            {{item.productDescription}}
                        </td>
                        <td>
                            <input type="checkbox" [checked]="item.isCustomerInventory" disabled>
                        </td>
                        <td>
                            {{item.wareHouseName}}
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
<div class="card">
    <div class="card-body">
        <div class="row">
            <div class="col-md-12 text-right">
                <button type="button" class="btn btn-dark" (click)="receiveItem()"><em class=""></em> Receive</button>
                <button type="button" class="btn btn-default" (click)="cadoCancelncled()"><em class="fa fa-remove"></em>
                    Cancel</button>
            </div>
        </div>
    </div>
</div>
