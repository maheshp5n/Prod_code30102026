
        <div class="panel panel-default" style="max-height: 75vh;overflow: auto;">
                <div class="panel-heading">
                  <span class="text-center"> Information</span>
                </div>
                <div class="panel-body">
                  <div class="row">
                    <div class="col-md-6 col-sm-6">
                      <div class="row">
                        <div class="col-md-12 form-group required">
                          <div class="control-label">
                            Name
                          </div>
                          <input type="text" class="form-control" *ngIf="_isEditMode == false" [(ngModel)]="ssares.name" >
                          <input type="text" class="form-control" *ngIf="_isEditMode == true" [(ngModel)]="ssares.name"disabled >
                         
                        </div>
                      </div>
                   </div>
                    <div class="col-md-6 col-sm-6">
                      <div class="row">
      
                      </div>
                       <div class="col-md-12 form-group required">
                        <div class="control-label">
                         Circle
                        </div>
                         <div class="row">
                            <div class="col-md-10 col-sm-10">
                                <ng-select *ngIf="circlesList" [items]="circlesList" appendTo="body"
                                    [(ngModel)]="ssares.circleName" bindLabel="circleName" bindValue="circleName"
                                    placeholder="Search Circle ...">
                                    <ng-template ng-label-tmp let-item="item">
                                        <img height="15"  width="15" alt="Circles" src="assets/images/circles_120.png"
                                            style="background-color: rgb(198, 90, 2107);" /> {{item.circleName}}
                                    </ng-template>
                                    <ng-template ng-option-tmp let-item="item" let-index="index" let-search="searchTerm">
                                        <img height="15" alt="" width="15" src='/assets/images/circles_120.png'
                                            style="background-color: rgb(198, 90, 207);" /> {{item.circleName}}
                                    </ng-template>
                                </ng-select>
                            </div>
                            <div class="col-md-2 col-sm-2">
                                <span class="input-group-append" >
                                    <div><i [ngClass]="faPlus"  *ngIf="rights('CircleDetails','create')" class="border-left-0" (click)="addNewCircle()"></i></div>
                                </span>
                               
                            </div>
                        </div>
                      </div>
                     </div>
                  </div>
                </div>
      
              </div>
              <div class="row">
                  <div class="col-md-12 text-right">
                    <button type="button" (click)="cancelSSAData()" class="btn btn-default"> <i class="fa fa-remove"></i> Cancel</button>&nbsp;
                    <!-- <button type="button" (click)="postAndNew()" class="btn btn-default">Create & New</button>&nbsp; -->
                    <button type="button" (click)="postSSA()" class="btn btn-primary"><i class="fa fa-save"></i> save </button>
                  </div>
                </div>

<!-- ============add circle ========= -->
<div class="modal fade" bsModal #createCircleModel="bs-modal" (onShow)="modelmeta.circleModelOpen=true" (onHide)="modelmeta.circleModelOpen=false" [config]="{backdrop: 'static'}" tabindex="-1"
role="dialog" aria-labelledby="create-new-circle">
<div class="modal-dialog modal-lg">
  <div class="modal-content">
    <div class="modal-header">
      <h4 id="create-account" class="modal-title pull-left">{{heading}}</h4>
      <button type="button" class="close pull-right" aria-label="Close" (click)="createCircleModel.hide()">
        <span aria-hidden="true">&times;</span>
      </button>
    </div>
    <div class="modal-body">
      <app-create-new-circle *ngIf="modelmeta.circleModelOpen" [isEditMode]="isEditMode" [editCircleData]="newcircles"
        (onCircleCreated)="onCircleCreated($event)" (onCancle)="cancelCircleData()"></app-create-new-circle>
    </div>
  </div>
</div>
</div>
