<button *ngIf="btnshow" class="btn btn-outline-info btn-sm" (click)="approvalModule.show()">Approve/Reject</button>
<div *ngIf="btnshow" class="modal fade" bsModal #approvalModule="bs-modal" role="dialog" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h4 class="modal-title pull-left">
                    Approval Of {{toBeApprovedSelected.objectManualId}}
                </h4>
                <button type="button" (click)="approvalModule.hide()" class="close pull-right">
                    <span>&times;</span>
                </button>

            </div>
            <div class="modal-body">

                <div class="card card-body" style="padding:0px;">
                    <textarea rows="5" cols="5" [(ngModel)]="approvalRequest.remark">

                    </textarea>

                </div>
                <div class="row">
                    <div class="col-md-4">
                        <select class="form-control" [(ngModel)]="approvalRequest.action">
                            <option value="select" disabled>--Select--</option>
                            <option value="Approved">Approve</option>
                            <option value="Rejected">Reject</option>
                            <!-- <option value="Re-Assign">Re-Assign</option> -->
                        </select>
                    </div>
                    <div class="col-md-4">

                        <div *ngIf="approvalRequest.action=='Re-Assign'">

                        </div>
                    </div>
                    <div class="col-md-4 text-right">
                        <button type="button" (click)="doApproveOrReject()" class="btn btn-info"><em
                                class="fa fa-save"></em> Save</button>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>

<!--Alert Module Starts-->
<div class="modal fade" bsModal #alertModule="bs-modal" role="dialog" tabindex="-1">
    <div class="text-center" style="margin-left: 20%;margin-right: 20%;">
        <strong>
            <alert [type]="alerttypes.type">
                <span [innerHTML]="alerttypes.message"></span>
                <button type="button" (click)="alertModule.hide()" class="close pull-right">
                    <span aria-hidden="true">&times;</span>
                </button>
            </alert>
        </strong>

    </div>
</div>
<!--Spinner on loading-->
<ngx-spinner size="medium" color="#fff" type="line-scale-party">
    <p style="font-size: 20px; color: rgb(255, 255, 255)">Loading...</p>
</ngx-spinner>
