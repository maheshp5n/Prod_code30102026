<div class="panel panel-default">
    <div class="panel-heading">
      <span class="text-center">Account Information</span>
    </div>
    <div class="panel-body">
      <div class="row">
        <div class="col-md-6 col-sm-6">
          <div class="row">
            <div class="col-md-4">
              Account Name
            </div>
            <div class="col-md-8">
              <input  type="text" class="form-control">
            </div>
          </div>
          <div class="row">
            <div class="col-md-4">
              Type
            </div>
            <div class="col-md-8">
              <select  class="form-control">
                <option> </option>
              </select>
            </div>
          </div>
          <div class="row">
            <div class="col-md-4">
              Description
            </div>
            <div class="col-md-8">
              <textarea  class="form-control" rows="3"></textarea>
            </div>
          </div>
          <div class="row">
            <div class="col-md-4">
              Catagory
            </div>
            <div class="col-md-8">
              <select class="form-control">
                <option></option>
              </select>
            </div>
          </div>
          <div class="row">
            <div class="col-md-4">
              Email
            </div>
            <div class="col-md-8">
              <input  type="text" class="form-control" />
            </div>
          </div>
          <div class="row">
            <div class="col-md-4">
              SAP Customer No
            </div>
            <div class="col-md-8">
              <input  type="text" class="form-control" />
            </div>
          </div>
        </div>
        <div class="col-md-6 col-sm-6">
          <div class="row">
            <div class="col-md-4">
              Account Owner
            </div>
            <div class="col-md-8">
              <input  type="text" class="form-control plain-text">
            </div>
          </div>
          <div class="row">
            <div class="col-md-4">
              Phone
            </div>
            <div class="col-md-8">
              <input type="text" class="form-control" placeholder="Phone Number">
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="panel-heading">
      <span class="text-center">Address Information</span>
    </div>
    <div class="panel-body">
      <div class="row">
        <div class="col-md-6 col-sm-6">
          <div class="row">
            <div class="col-md-12">
              <label>
                Billing Address
              </label>
              <input   type="text" class="form-control">
            </div>
          </div>
          <div class="row">
            <div class="col-md-12">
              <label>
                Billing Street
              </label>
              <textarea  rows="3" class="form-control"></textarea>
            </div>
          </div>
          <div class="row">
            <div class="col-md-6">
              <label>
                Billing City
              </label>
              <input   type="text" class="form-control">
            </div>
            <div class="col-md-6">
              <label>
                Billing State/Province
              </label>
              <input   type="text" class="form-control">
            </div>
          </div>
          <div class="row">
            <div class="col-md-6">
              <label>
                Billing Zipc/Postal code
              </label>
              <input type="text" class="form-control">
            </div>
            <div class="col-md-6">
              <label>
                Billing Country
              </label>
              <input  type="text" class="form-control">
            </div>
          </div>
        </div>
        <div class="col-md-6 col-sm-6">
          <div class="row">
            <div class="col-md-12">
              <label>
                Shipping Address
              </label>
              <input  type="text" class="form-control">
            </div>
          </div>
          <div class="row">
            <div class="col-md-12">
              <label>
                Shipping Street
              </label>
              <textarea  rows="3" class="form-control"></textarea>
            </div>
          </div>
          <div class="row">
            <div class="col-md-6">
              <label>
                Shipping City
              </label>
              <input   type="text" class="form-control">
            </div>
            <div class="col-md-6">
              <label>
                Shipping State/Province
              </label>
              <input type="text" class="form-control">
            </div>
          </div>
          <div class="row">
            <div class="col-md-6">
              <label>
                Shipping Zipc/Postal code
              </label>
              <input   type="text" class="form-control">
            </div>
            <div class="col-md-6">
              <label>
                Shipping Country
              </label>
              <input  type="text" class="form-control">
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="panel-footer">
      <div class="row">
        <div class="col-md-12 text-right">
          <button type="button"  class="btn btn-default"><i class="fa fa-remove"></i> Cancel</button>&nbsp;
          <button type="button" class="btn btn-default"><i class="fa fa-save"></i> Save & New</button>&nbsp;
          <button type="button" class="btn btn-primary"><i class="fa fa-save"></i> Save </button>
        </div>
      </div>
    </div>
  </div>
