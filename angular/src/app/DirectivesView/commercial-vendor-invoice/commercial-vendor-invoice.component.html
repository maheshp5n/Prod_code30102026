<div class="panel panel-default" style="max-height: 75vh;overflow: auto;">
  <div class="panel-heading">
    <span class="text-center"> Information</span>
  </div>
  <div class="panel-body">
    <div class="row">
      <div class="col-md-6 col-sm-6">
        <div class="control-label">
          GRN Number
        </div>
        <input type="text" class="form-control" [(ngModel)]="comreq.grnNumber">
      </div>
      <div class="col-md-6 col-sm-6 form-group ">
        <div class="control-label">
          GRN Date
        </div>
        <input class="form-control" onkeydown="return false" bsDatepicker [bsConfig]="{ dateInputFormat: 'YYYY-MM-DD' }"
          [(ngModel)]="comreq.grnDate" [maxDate]="today" [dateCustomClasses]="dateCustomClasses"
          placeholder="Pick Date" autocomplete="off">&nbsp;
        <span class="fa fa-calendar errspan"></span>
      </div>
    </div>
    <div class="row">
      <div class="col-md-6 col-sm-6 form-group">
        <div class="control-label">
          Service Entry Number
        </div>
        <input type="text" class="form-control" [(ngModel)]="comreq.entrySheetNumber">
      </div>
      <div class="col-md-6 col-sm-6 form-group">
        <div class="control-label">
          Internal Service Code
        </div>
        <select [(ngModel)]="comreq.internalServiceCode" class="form-control">
          <option disabled value="0">--Select--</option>
          <option *ngFor="let o of internalServiceCodes" [ngValue]="o.id">{{o.internal_service_code}}</option>
        </select>
      </div>
    </div>
  </div>

</div>
<div class="row">
  <div class="col-md-12 text-right">
    <button type="button" (click)="cancelCommercial()" class="btn btn-default"> <i class="fa fa-remove"></i>
      Cancel</button>&nbsp;
    <!-- <button type="button" (click)="postAndNew()" class="btn btn-default">Create & New</button>&nbsp; -->
    <button type="button" (click)="postGRN()" class="btn btn-primary"><i class="fa fa-save"></i> save </button>
  </div>
</div>


<!-- popupSuccessModel -->
<div class="modal fade" bsModal #popupSuccessModel="bs-modal" [config]="{backdrop: 'static'}" tabindex="-1"
  role="dialog" aria-labelledby="create-product">

  <div [ngClass]="popupNgClass" style="width:40%; text-align: center">
    <button type="button" class="close pull-right" aria-label="Close" (click)="popupClose()">
      <span aria-hidden="true">&times;</span>
    </button>
    <strong *ngIf="message=='Submitted Successfully'">{{message}}</strong>
    <strong *ngIf="message!='Submitted Successfully'">{{message}}</strong>
  </div>
</div>
