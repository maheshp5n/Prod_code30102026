<div class="panel panel-default" style="max-height: 75vh;overflow: auto;">
    

    <div class="panel-heading">
        <span class="text-center" style="font-weight: bold"> Customer PO And Invoice Detail </span>
    </div>
    <div class="panel-body">

        <div class="row">
            <div class="col-md-6 col-sm-6 form-group ">
                <div class="control-label">
                    PO Number
                </div>
                <input type="text" class="form-control"[(ngModel)]="caseInvoiceRequest.poNumber">
            </div>
            <div class="col-md-6 col-sm-6 form-group ">
                <div class="control-label">
                    PO Date
                </div>
                <input class="form-control" onkeydown="return false" bsDatepicker
                [bsValue]="(this.poDate)" value="{{this.caseInvoiceRequest.poDate|date:'dd-MM-yyyy'}}"
                 [bsConfig]="{adaptivePosition: true}"
                    [maxDate]="today" [dateCustomClasses]="dateCustomClasses" autocomplete="off" (bsValueChange)="onPODatechange($event)">&nbsp;
                <span class="fa fa-calendar errspan"></span>
            </div>
        </div>
        <div class="row">
            <div class="col-md-6 col-sm-6 form-group ">
                <div class="control-label">
                    Invoice Number
                </div>
                <input type="text" class="form-control" [(ngModel)]="caseInvoiceRequest.invoiceNumber">
            </div>
            <div class="col-md-6 col-sm-6 form-group ">
                <div class="control-label">
                    Invoice Date
                </div>
                <input onkeydown="return false" class="form-control" bsDatepicker  [bsValue]="(this.inovoiceDate)" value="{{this.caseInvoiceRequest.invoiceDate|date:'dd-MM-yyyy'}}"
                [bsConfig]="{adaptivePosition: true}"
                [maxDate]="today" [dateCustomClasses]="dateCustomClasses" autocomplete="off"(bsValueChange)="onInvoiceDatechange($event)">&nbsp;
            <span class="fa fa-calendar errspan"></span>
                <!-- <input class="form-control"[(ngModel)]="caseInvoiceRequest.invoiceDate" bsDatepicker [bsConfig]="{ dateInputFormat: 'YYYY-MM-DD' }"
                    [maxDate]="today" [dateCustomClasses]="dateCustomClasses" autocomplete="off">&nbsp;
                <span class="fa fa-calendar errspan"></span> -->
            </div>
        </div>



    </div>
    <!-- <div class="panel-heading">
        <span class="text-center" style="font-weight: bold">Vendor Invoice Details </span>
    </div> -->
    <!-- <div class="panel-body">

        <div class="row">
            <div class="col-md-6 col-sm-6 form-group ">
                <div class="control-label">
                    Vendor Invoice Number
                </div>
                <input type="text" class="form-control"[(ngModel)]="caseInvoiceRequest.vendorInvoiceNumber">
            </div>
            <div class="col-md-6 col-sm-6 form-group ">
                <div class="control-label">
                    Vendor Invoice Date
                </div>
                <input class="form-control " [(ngModel)]="caseInvoiceRequest.vendorInvoiceDate" bsDatepicker [bsConfig]="{ dateInputFormat: 'YYYY-MM-DD' }"
                    [maxDate]="today" [dateCustomClasses]="dateCustomClasses">&nbsp;
                <span class="fa fa-calendar errspan"></span>
            </div>
        </div>



    </div> -->

</div>

<!--  // save and close button -->
<div class="row">
    <div class="col-md-12 text-right">
        <button type="button" (click)="cancelInvoiceData()" class="btn btn-default"><i class="fa fa-remove"></i>
            Cancel</button>&nbsp;
        <button type="button" (click)="postInvoice()" class="btn btn-primary"><i class="fa fa-save"></i>
            Save
        </button>
    </div>
</div>


<div class="modal fade" bsModal #popupSuccessModel="bs-modal" [config]="{backdrop: 'static'}" tabindex="-1"
    role="dialog" aria-labelledby="create-product">

    <div [ngClass]="popupNgClass" style="width:40%; text-align: center">
        <button type="button" class="close pull-right" aria-label="Close" (click)="popupClose()">
            <span aria-hidden="true">&times;</span>
        </button>
        <strong *ngIf="message!='Updated Successfully'"> &nbsp;{{message}}!</strong>
        <strong *ngIf="message=='Updated Successfully'">&nbsp;{{message}} !</strong>

    </div>
</div>
