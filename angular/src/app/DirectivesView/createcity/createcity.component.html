
        <div class="panel panel-default" style="max-height: 75vh;overflow: auto;">
            <div class="panel-heading">
              <span class="text-center"> Information</span>
            </div>
            <div class="panel-body">
              <div class="row">
                <div class="col-md-6 col-sm-6">
                  <div class="row">
                    <div class="col-md-12 form-group required">
                      <div class="control-label">
                        Name
                      </div>
                      <input *ngIf="_isEditMode == true" type="text" class="form-control" [(ngModel)]="res.cityName" disabled>
                      <input *ngIf="_isEditMode == false" type="text" class="form-control" [(ngModel)]="res.cityName">
                    </div>
                  </div>
               </div>
                <div class="col-md-6 col-sm-6">
                  <div class="row">
  
                  </div>
                   <div class="col-md-12 form-group required">
                    <div class="control-label">
                      City Category
                    </div>
                    <select name="type" [(ngModel)]="res.cityCategoryId" class="form-control">
                        <option  value='0' disabled>--Select Category--</option>
                      <option *ngFor="let res of tabledata " [ngValue]="res.cityCategoryId">{{res.cityCatagoryName}}
                      </option>
                     </select>
                  </div>
                 </div>
              </div>
            </div>
  
          </div>
          <div class="row">
              <div class="col-md-12 text-right">
                <button type="button" (click)="cancelData()" class="btn btn-default"> <i class="fa fa-remove"></i> Cancel</button>&nbsp;
                <!-- <button type="button" (click)="postAndNew()" class="btn btn-default">Create & New</button>&nbsp; -->
                <button type="button" (click)="postCity()" class="btn btn-primary"><i class="fa fa-save"></i> save </button>
              </div>
            </div>
  
  <!-- popupSuccessModel -->
<div class="modal fade" bsModal #popupSuccessModel="bs-modal" [config]="{backdrop: 'static'}" tabindex="-1"
role="dialog" aria-labelledby="create-product">

<div [ngClass]="popupNgClass" style="width:40%; text-align: center">
  <button type="button" class="close pull-right" aria-label="Close" (click)="popupClose()">
    <span aria-hidden="true">&times;</span>
  </button>
  <strong *ngIf="message=='Submitted Successfully'">City ( <a href="#" routerLink="/city/{{cityNameTamp}}" activateRout="active">{{cityNameTamp}}</a>)
    &nbsp;Created Successfully !</strong>
  <strong *ngIf="message!='Submitted Successfully'">{{message}}</strong>
</div>
</div>
