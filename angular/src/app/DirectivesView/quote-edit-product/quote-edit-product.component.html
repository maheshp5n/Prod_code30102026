<!-- editAllProducts -->
<div class="panel panel-default" *ngIf="_isEditAll">
    <div class="panel-body">
        <div class="table table-responsive">
            <table class="table table-sm table-condensed tablerview">
                <thead style="background-color:rgb(248, 245, 245)">
                    <tr>
                        <th>S. No</th>
                        <th>Part Code</th>
                        <th>List Price</th>
                        <th>Sales Price</th>
                        <th>Quantity</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let q of quoteLineItemRequestArray;let i = index">
                        <td>{{i+1}}.</td>
                        <td>{{q.partCode}}</td>
                        <td>{{q.listPrice}}</td>
                        <td><input type='text' [(ngModel)]="q.price" (keypress)="onlyNumbersForRs($event)"/>
                        </td>
                        <td><input type='text' [(ngModel)]="q.quantity" (keypress)="onlyNumbers($event)" />
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div class="row">
            <div class="col-md-12 text-right">
                <button type="button" (click)="canceleditAllData()" class="btn btn-default"> <i
                        class="fa fa-remove"></i>Cancel</button>&nbsp;
                <button type="button" (click)="editAll()" class="btn btn-primary"><i class="fa fa-save"></i>
                    Edit Product
                </button>
            </div>
        </div>
    </div>
</div>



<div class="panel panel-default" *ngIf="_isEditAll==false">

    <div class="panel-heading">
        <strong>Product Information</strong>
    </div>

    <div class="panel-body">

        <div class="row">
            <div class="col-md-6 col-sm-6 form-group">
                <div class="control-label">Quote</div>
                <input type="text" class="form-control" [(ngModel)]="quoteLineItemRequest.quoteName" disabled>
            </div>
            <div class="col-md-6 col-sm-6 form-group">
                <div class="control-label">List Price</div>
                <input type="text" class="form-control" [(ngModel)]="quoteLineItemRequest.listPrice" disabled>
            </div>

        </div>

        <div class="row">
            <div class="col-md-6 col-sm-6 form-group">
                <div style="font: bolder;">Part Code</div>
                <input type="text" class="form-control" [(ngModel)]="quoteLineItemRequest.partCode" disabled>
            </div>
            <div class="col-md-6 col-sm-6 form-group required">
                <div style="font: bolder;">Sales Price</div>
                <input type="text" class="form-control" [(ngModel)]="quoteLineItemRequest.price" (keypress)="onlyNumbersForRs($event)">
            </div>
        </div>

        <div class="row">
            <div class="col-md-6 col-sm-6 form-group">
                <div class="control-label">Product Description</div>
                <input type="text" class="form-control" [(ngModel)]="quoteLineItemRequest.pdoductDescription" disabled>
            </div>
            <div class="col-md-6 col-sm-6 form-group required">
                <div class="control-label">Quantity</div>
                <input type="text" class="form-control" [(ngModel)]="quoteLineItemRequest.quantity" (keypress)="onlyNumbers($event)">
            </div>
        </div>

        <div class="row">
            <div class="col-md-6 col-sm-6 form-group">
                <div class="control-label">Total Price</div>
                <input type="text" class="form-control" [(ngModel)]="quoteLineItemRequest.totalPrice" disabled>
            </div>
            <!-- <div class="col-md-6 col-sm-6 form-group">
                <div class="control-label">Unique</div>
                <input type="text" class="form-control" [(ngModel)]="quoteLineItemRequest.unique">
            </div> -->
        </div>
    </div>

    <div class="row">
        <div class="col-md-12 col-sm-12 text-right">
            <button type="button" class="btn btn-sm btn-default" (click)="cancelDataEditProduct()"><i
                    class="fa fa-remove"></i>&nbsp;
                Cancel</button>&nbsp;
            <button type="button" class="btn btn-sm btn-primary" (click)="editApiQuoteLineItem()"><i
                    class="fa fa-save"></i>&nbsp;
                Save</button>
        </div>
    </div>
</div>

<div class="modal fade" bsModal #popupSuccessModel="bs-modal" [config]="{backdrop: 'static'}" tabindex="-1"
    role="dialog" aria-labelledby="popupSuccessModel">
    <div [ngClass]="popupNgClass" style="width:40%; text-align: center">
        <button type="button" class="close pull-right" aria-label="Close" (click)="popupClose()">
            <span aria-hidden="true">&times;</span>
        </button>
        <strong>{{message}}</strong>
    </div>
</div>
