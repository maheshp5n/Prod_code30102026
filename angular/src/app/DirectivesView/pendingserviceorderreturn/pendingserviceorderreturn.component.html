<button type="button" class="btn btn-sm btn-outline-info" (click)="onReturnClick()">SO Return</button>

<div class="modal fade" bsModal #pendingToreturn="bs-modal" tabindex="-1" role="dialog">
    <div class="modal-dialog modal-lg modal-xl">
        <div class="modal-content">
            <div class="modal-header">
                <h4 class="modal-title pull-left">Pending To Return Service Order Item</h4>
                <button type="button" class="close pull-right" aria-label="Close" (click)="pendingToreturn.hide()">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <div class="card">
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-4 form-group ">
                                <div class="control-label" style="text-align: left;">
                                    Ship To Name
                                    <em class="fa fa-info-circle" style="padding-left: 10px;"
                                    tooltip="Courier Company Name / Person Name"></em>
                                </div>
                                <!-- <label><small>Ship To Name</small> </label> -->
                                <input [(ngModel)]="returnd.shipToName" type="text" class="form-control">
                            </div>
                            <div class="col-md-4">
                                <div class="control-label"  style="text-align: left;">
                                    Shipping Mode
                                </div>
                                <!-- <label><small>Shipping Mode</small></label> -->
                                <select [(ngModel)]="returnd.shippingMode" class="form-control">
                                    <option value="" disabled>--Select--</option>
                                    <option value="ByHand"> By Hand</option>
                                    <option value="courier">By Courier</option>
                                    <option value="Transport">Transport</option>
                                </select>
                            </div>
                            <div class="col-md-4 form-group">
                                 <div class="control-label"style="text-align: left;" >
                                    Tracking Number
                                    <em class="fa fa-info-circle" style="padding-left: 10px;"
                                    tooltip="Courier Tracking Number / Person Mobile Number"></em>
                                 </div>
                                <!-- <label><small>Tracking Number</small></label> -->
                                <input [(ngModel)]="returnd.trackingNumber" type="text" class="form-control">
                            </div>
                        </div>
                    </div>
                </div>
                <div style="max-height: 65vh;overflow:auto;">


                    <div class="card">
                        <div class="card-body" style="padding: 0px;">
                            <table class="table table-sm" #serviceorderdetailstable>
                                <thead>
                                    <tr>
                                        <th class="text-left">
                                            <input type="checkbox" [(ngModel)]="maincheck"
                                                (change)="oncheckBoxChange()">
                                        </th>
                                        <th>
                                            JOB Card
                                        </th>
                                        <th>
                                            Part code
                                        </th>
                                        <th>
                                            Serial Number
                                        </th>
                                        <th>
                                            Service Order
                                        </th>
                                        <th>
                                            Customer Inventory
                                        </th>
                                        <th>
                                            Product Status
                                        </th>
                                        <th>
                                            Repaired
                                        </th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr *ngFor="let item of returndata">
                                        <td class="text-left"><input type="checkbox" [checked]="item.selected"
                                                [(ngModel)]="item.selected"></td>
                                        <td>
                                            <a [routerLink]="['/dctrepari',item.jobCardId]"
                                                [routerLinkActive]="['active']">
                                                {{item.jobCardManualId}}</a>
                                        </td>
                                        <td>
                                            <a [routerLink]="['/products',item.productPartCode]"
                                                [routerLinkActive]="['active']">{{item.productPartCode}}</a>
                                        </td>
                                        <td>
                                            {{item.productSerialNumber}}
                                        </td>
                                        <td>
                                            <a [routerLink]="['/serviceorder',item.serviceOrderId]">
                                                {{item.serviceOrderManualId}}</a>
                                        </td>
                                        <td>
                                            <span *ngIf="item.isCustomerInventory" class="tik-mark"></span>
                                        </td>
                                        <td>
                                            <select [(ngModel)]="item.jobcardProductFinalStatus">
                                                <option value="0" disabled>--Select--</option>
                                                <option value="1">Ok</option>
                                                <option value="2">Faulty</option>
                                                <option value="3">Scrap</option>
                                                <option value="4">Rejected</option>
                                                <option value="5">BER</option>
                                            </select>

                                        </td>
                                        <td class="text-left">
                                            <em *ngIf="item.jobcardRepaired" class="tik-mark"></em>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
                <div class="row">

                    <div class="col-md-12 text-right">
                        <button type="button" class="btn btn-primary" (click)="exportToexcel()"><em class="fa fa-file-excel-o"></em> Export As Excel</button>
                        <button type="button" (click)="pendingToreturn.hide()" class="btn btn-default"><em class="fa fa-remove"></em> Cancel</button>
                        <button type="button" (click)="onSaveClick()" class="btn btn-dark"><em class="fa fa-save"></em> Save</button>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>
