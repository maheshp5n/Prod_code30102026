<div class="panel panel-default" style="max-height: 75vh;overflow: auto;">
    <div class="panel-heading">
        <span class="text-center" style="font-weight: bold"> Information</span>
    </div>
    <div class="panel-body">
        <div class="row">
            <div class="col-md-6 col-sm-6 form-group required">
                <div class="control-label">
                    Parent Customer Name
                </div>
                <input type="text" [(ngModel)]="parentcustomer.customerName" class="form-control">
            </div>
            <div *ngIf="false" class="col-md-6 col-sm-6 form-group ">
                <div class="control-label">
                    Owner
                </div>
                <input type="text" class="form-control" value="{{loginData.firstName}} {{loginData.middleName}} {{loginData.lastName}}" disabled>
            </div>
        </div>
    </div>
</div>

<div class="row">
    <div class="col-md-12 text-right">
        <button type="button" (click)="cancelData()" class="btn btn-default"><i class="fa fa-remove"></i>
            Cancel</button>&nbsp;
        <!-- <button type="button" (click)="postCreateAccountAndNew(sampAccountNumber)" class="btn btn-default"><i class="fa fa-save"></i>
              Save & New</button>&nbsp; -->
        <button type="button" (click)="postCreateAccount()" class="btn btn-primary"><i
                class="fa fa-save"></i>
            Save
        </button>
    </div>
</div>

<div class="modal fade" bsModal #popupSuccessModel="bs-modal" [config]="{backdrop: 'static'}" tabindex="-1"
  role="dialog" aria-labelledby="create-customer">

  <div [ngClass]="popupNgClass" style="width:40%; text-align: center">
    <button type="button" class="close pull-right" aria-label="Close" (click)="popupClose()">
      <span aria-hidden="true">&times;</span>
    </button>
    <strong *ngIf="message=='Submitted Successfully'">
        <!-- Customer ( <a href="#"
        routerLink="/accounts/{{this.createAccount.sampAccountNumber}}">{{this.createAccount.sampAccountNumber}}</a>
      ) -->
      Created successfully !</strong>
    <strong *ngIf="message!='Submitted Successfully'">{{message}}</strong>
  </div>
</div>
