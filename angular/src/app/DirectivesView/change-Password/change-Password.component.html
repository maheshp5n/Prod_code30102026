<div class="panel panel-default">
  <div class="panel-heading">
    <strong>Change password</strong>
  </div>
  <div class="panel-body">


    <!-- Ankur -->
    <div class="row">
      <div class="col-md-6 col-sm-6 form-group required">
        <div class="control-label">
          Part Code
        </div>
        <input *ngIf="_isEditMode == true" [(ngModel)]="newProduct.partCode" type="text" class="form-control" disabled>
        <input *ngIf="_isEditMode == false" [(ngModel)]="newProduct.partCode" type="text" class="form-control">
      </div>
      <div class="col-md-6 col-sm-6 form-group required">
        <div class="control-label">
          Type
        </div>

        <select [(ngModel)]="newProduct.type" class="form-control">
          <option disabled>--none--</option>
          <option>Product</option>
          <option>Sub-Product</option>
          <option>Component</option>
        </select>
      </div>
    </div>



    <div class="row">
      <div class="col-md-6 col-sm-6 form-group required">
        <div class="control-label">
          Product Family
        </div>
        <select [(ngModel)]="newProduct.productFamilyId" class="form-control" (change)="getproductSubFamily()">
          <option *ngFor="let o of productFamily;" [ngValue]="o.id">
            {{o.name}}</option>
        </select>
      </div>
      <div class="col-md-6 col-sm-6 form-group required">
        <div class="control-label">
          Product Sub Family
        </div>
        <select [(ngModel)]="newProduct.subProductFamilyId" class="form-control">
          <option *ngFor="let s of productSubFamily;" [ngValue]="s.id">
            {{s.name}}</option>
        </select>
      </div>
    </div>



    <div class="row">
      <div class="col-md-6 col-sm-6 form-group required">
        <div class="control-label">
          Price
        </div>
        <input [(ngModel)]="newProduct.price" type="text" class="form-control">

      </div>
      <div class="col-md-6 col-sm-6 form-group required">
        <div class="control-label">
          Product Description
        </div>
        <input [(ngModel)]="newProduct.productDescription" class="form-control" rows="3">
      </div>
    </div>




  </div>
</div>
<!-- <div class="panel-footer"> -->
<div class="row">
  <div class="col-md-12 col-sm-12 text-right">
    <button type="button" class="btn btn-sm btn-default" (click)="cancelData()"><i class="fa fa-remove"></i>&nbsp;
      Cancel</button>&nbsp;
    <button type="button" (click)="createProductAndNew()" class="btn btn-sm btn-default"><i
        class="fa fa-save"></i>&nbsp;
      Save & New</button>&nbsp;
    <button type="button" (click)="createProduct()" class="btn btn-sm btn-primary"><i class="fa fa-save"></i>&nbsp;
      Save</button>
  </div>
</div>
