<div class="panel panel-default" style="max-height: 75vh;overflow: auto;">
    <div class="panel-heading">
        <span class="text-center" style="font-weight: bold"> Terms & Conditions</span>
    </div>
    <div class="panel-body">
        <div class="row">
            <div class="col-md-6 col-sm-6 form-group">
                <div class="control-label">
                    Object
                </div>
                <input type="text" class="form-control">
            </div>
            <div class="col-md-6 col-sm-6 form-group">

            </div>
        </div>
        <div class="row">
            <div class="col-md-6 col-sm-6 form-group">
                <div class="control-label">
                    No.
                </div>
                <select class="form-control">
                    <option value="0">--None--</option>
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                    <option value="6">6</option>
                    <option value="7">7</option>
                    <option value="8">8</option>
                    <option value="9">9</option>
                    <option value="10">10</option>
                </select>
            </div>
            <div class="col-md-6 col-sm-6 form-group">
                <div class="control-label">
                    Rule
                </div>
                <textarea type="text" rows="2" class="form-control"></textarea>
            </div>
        </div>
        <div class="row">
            <div class="col-md-6 col-sm-6 form-group"></div>
            <div class="col-md-6 col-sm-6 form-group text-right">
                <button class="btn btn-md btn-primary" (click)="addTermAndCondition()"><i class="fa fa-plus"></i>
                    Add</button>
            </div>
        </div>

        <div class="table-responsive">
            <table class="table table-sm table-condensed tablerview">
                <thead style="background-color:rgb(248, 245, 245)">
                    <tr>
                        <th title="S.No">S.No.</th>
                        <th title="Rule">Rule</th>
                        <th title="Action"> Action </th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>1</td>
                        <td>rule</td>
                        <td><a id="removebtn" (click)="removeTermAndCondition()"><i class="fa fa-remove"></i></a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<div class="row">
    <div class="col-md-12 text-right">
        <button type="button" (click)="cancelData()" class="btn btn-default"><i class="fa fa-remove"></i>
            Cancel</button>&nbsp;
        <button type="button" (click)="postCreate()" class="btn btn-primary"><i class="fa fa-save"></i>
            save
        </button>
    </div>
</div>


<div class="modal fade" bsModal #popupSuccessModel="bs-modal" [config]="{backdrop: 'static'}" tabindex="-1"
    role="dialog" aria-labelledby="create-productConsumed">

    <div [ngClass]="popupNgClass" style="width:40%; text-align: center">
        <button type="button" class="close pull-right" aria-label="Close" (click)="popupClose()">
            <span aria-hidden="true">&times;</span>
        </button>
        <strong *ngIf="message=='Submitted Successfully'">
            Created successfully !</strong>
        <strong *ngIf="message!='Submitted Successfully'">{{message}}</strong>
    </div>
</div>
