            <option *ngFor="let o of typeList;" [ngValue]="o.expenseTypeId">{{o.expenseTypeName}}</option>

          <div class="control-label">Purpose</div>
          <input [(ngModel)]="newexpensesmanagement.purposeOfVisit" type="text" class="form-control">
        </div>

        <div class="col-md-6 col-sm-6 form-group">

    <div class="panel-heading" style="display: none;">
      <strong>For the use of Account's Department only</strong>
    </div>
    <div class="panel-body" style="display: none;">
      <div class="row">
        <div class="col-md-6 col-sm-6 form-group">
          <div class="control-label">Narration</div>
          <input [(ngModel)]="newexpensesmanagement.narration" type="text" class="form-control">
        </div>
        <div class="col-md-6 col-sm-6 form-group">
          <div class="control-label">Business Area</div>
          <select [(ngModel)]="newexpensesmanagement.businessAreaId" class="form-control">
            <option value='0' disabled>--select--</option>
            <option *ngFor="let o of businessAreaForList;" [ngValue]="o.businessAreaId"> {{o.businessAreaName}}</option>
          </select>
        </div>
      </div>
      <div class="row">
        <div class="col-md-6 col-sm-6 form-group">
          <div class="control-label">Business Place</div>
          <select [(ngModel)]="newexpensesmanagement.businessPlaceId" class="form-control">
            <option value='0' disabled>--select--</option>
            <option *ngFor="let o of businessPlaceForList;" [ngValue]="o.businessPlaceId"> {{o.businessPlaceName}}
            </option>
          </select>
        </div>
        <div class="col-md-6 col-sm-6 form-group">
        </div>
      </div>
    </div>
  
  
    <div class="row">
      <div class="col-md-12 col-sm-12 text-right">
        <button type="button" class="btn btn-sm btn-default" (click)="cancelData()"><i class="fa fa-remove"></i>&nbsp;
          Cancel</button>&nbsp;
  
        <button type="button" (click)="createexpensesmanagement()" class="btn btn-sm btn-primary"><i
            class="fa fa-save"></i>&nbsp;
          Save</button>
      </div>
