<div class="panel panel-default" style="max-height: 70vh; overflow: auto;">
    <div class="panel-body">
  
      <div *ngIf="_isEditModeBoarding" class="row">
        <div class="col-md-6 col-sm-6 form-group">
          <div class="control-label">Name</div>
          <input [(ngModel)]="boardingRequest.manualId" type="text" class="form-control" disabled>
        </div>
        <div class="col-md-6 col-sm-6 form-group required">
          <div class="control-label">Expenses Report</div>
          <input [(ngModel)]="boardingRequest.expenseManagementManualId" type="text" class="form-control" disabled>
        </div>
      </div>
  
      <div class="row">
        <div class="col-md-3 col-sm-3 form-group required">
          <div class="control-label">From Date</div>
          <input [(ngModel)]="boardingRequest.from"onkeydown="return false" type="text" class="form-control" bsDatepicker
            [bsConfig]="{ dateInputFormat: 'YYYY-MM-DD'}" [maxDate]="today" [dateCustomClasses]="dateCustomClasses"autocomplete="off">
          <span class="fa fa-calendar errspan"></span>
        </div>
        <div class="col-md-3 col-sm-3 form-group required">
          <div class="control-label"> From Time</div>
          <select [(ngModel)]="boardingRequest.fromTime" class="form-control">
            <option value="select" disabled>--select--</option>
            <option *ngFor="let t of timeList" [value]="t.time">{{t.time}}
            </option>
          </select>
        </div>
  
        <div class="col-md-3 col-sm-3 form-group required">
          <div class="control-label">To Date</div>
          <input [(ngModel)]="boardingRequest.to" type="text" class="form-control" bsDatepicker onkeydown="return false"
            [bsConfig]="{ dateInputFormat: 'YYYY-MM-DD' }" [maxDate]="today" [dateCustomClasses]="dateCustomClasses" autocomplete="off">
          <span class="fa fa-calendar errspan"></span>
        </div>
        <div class="col-md-3 col-sm-3 form-group required">
          <div class="control-label"> To Time</div>
          <select  class="form-control" [(ngModel)]="boardingRequest.toTime">
            <option value="select" disabled>--select--</option>
            <option *ngFor="let t of timeList" [value]="t.time">{{t.time}}
            </option>
          </select>
        </div>
  
      </div>
  
      <div class="row">
        <div class="col-md-6 col-sm-6 form-group required">
          <div class="control-label">
            City
          </div>
          <div class="row">
            <div class="col-md-10 col-sm-10" >
              <ng-select *ngIf="cityList" appendTo="body" [items]="cityList" [(ngModel)]="boardingRequest.cityName" bindLabel="cityName"
                bindValue="cityName" placeholder="Search City...">
                <ng-template ng-label-tmp let-item="item">
                  <img height="15" alt="" width="15" src='/assets/images/city_120.png'
                    style="background-color: rgb(198, 172, 240);" /> {{item.cityName}}
                </ng-template>
                <ng-template ng-option-tmp let-item="item" let-index="index" let-search="searchTerm">
                  <img height="15" alt="" width="15" src='/assets/images/city_120.png'
                    style="background-color: rgb(198, 172, 240);" /> {{item.cityName}}
                </ng-template>
              </ng-select>
            </div>
            <div class="col-md-2 col-sm-2">
              <span class="input-group-append">
                <div><i [ngClass]="faPlus" class="border-left-0" (click)="addNewCity()"></i></div>
              </span>
            </div>
          </div>
        </div>
        <div class="col-md-6 col-sm-6 form-group">
          <div class="control-label">Other City</div>
          <input [(ngModel)]="boardingRequest.otherCity" type="text" class="form-control">
        </div>
      </div>
  
      <div class="row">
        <div class="col-md-6 col-sm-6 form-group required"  style="display:none;">
          <div class="control-label">No. Of Days</div>
          <input [(ngModel)]="boardingRequest.NoOfDayes" type="number" class="form-control"
            onkeydown="return event.keyCode !== 69">
        </div>
        <div *ngIf="_isEditModeBoarding" class="col-md-6 col-sm-6 form-group ">
          <div class="control-label">
            City Category
          </div>
          <select [(ngModel)]="cityDetailsReq.cityCategoryId" class="form-control">
            <option value="0">--select--</option>
            <option *ngFor="let o of cityCategory" [ngValue]="o.cityCategoryId">{{o.cityCatagoryName}}</option>
          </select>
        </div>
        <div class="col-md-6 col-sm-6 form-group" style="display: none;">
          <div class="control-label">Amount
          </div>
          <input [(ngModel)]="boardingRequest.amount" type="number"  class="form-control"
            onkeydown="return event.keyCode !== 69" disabled>
        </div>
      </div>
  
      <div class="row" *ngIf="_isEditModeBoarding" style="display: none;">
        <div class="col-md-6 col-sm-6 form-group">
          <div class="control-label">Entitlement/Day</div>
          <input [(ngModel)]="boardingRequest.entitlementPerDay" type="number" class="form-control" disabled>
        </div>
        <div class="col-md-6 col-sm-6 form-group">
          <div class="control-label">City Category
          </div>
          <input [(ngModel)]="boardingRequest.cityCategoryId" type="number" class="form-control" disabled>
        </div>
      </div>
       
      <div class="row">
        <div class="col-md-6 col-sm-6 form-group">
          <div class="control-label">Remarks</div>
          <textarea [(ngModel)]="boardingRequest.remark" name="" class="form-control" id="" cols="30" rows="2"
            maxlength="1000"></textarea>
  
        </div>
        <div class="col-md-6 col-sm-6 form-group">
          <div class="control-label">Grade</div>
        <a  [routerLink]="[]" (click)="OpnGrade(boardingName)"> {{boardingName}}</a>
  
        </div>
        
      </div>
      <div class="row">
        <div class="col-md-6 col-sm-6 form-group" *ngIf="_isEditModeBoarding">
          <div class="control-label">Amount to Disburse</div>
          <input type="text" [(ngModel)]="boardingRequest.amountToDisbursed" class="form-control">
            </div>
      </div>
  
    </div>
  </div>
  <div class="row">
    <div class="col-md-12 col-sm-12 text-right">
      <button type="button" class="btn btn-default" (click)="cancelBoarding()"><i class="fa fa-remove"></i>&nbsp;
        Cancel</button>&nbsp;
      <button type="button" class="btn btn-primary" (click)="createBoarding()"><i class="fa fa-save"></i>&nbsp;
        Save</button>
    </div>
  </div>

  <!-- City Starts-->
  <div class="modal fade" bsModal #createCityModel="bs-modal" [config]="{backdrop: 'static'}" tabindex="-1" role="dialog">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h4 class="modal-title pull-left">New City</h4>
          <button type="button" class="close pull-right" aria-label="Close" (click)="createCityModel.hide()">
            <span aria-hidden="true">&times;</span>
          </button>
        </div>
        <div class="modal-body" style="min-height: 500px;overflow: auto;padding-left: 2mm">
          <div class="panel panel-default">
            <div class="panel-heading">
              <span class="text-center" style="font-weight: bold">Information</span>
            </div>
            <div class="panel-body">
              <div class="row">
                <div class="col-md-4 col-sm-4 form-group ">
                  <div class="control-label">
                    City
                  </div>
                  <input type="text" class="form-control" [(ngModel)]="cityDetailsReq.cityName">
                </div>
  
                <div class="col-md-4 col-sm-4 form-group ">
                  <div class="control-label">
                    City Category
                  </div>
                  <select [(ngModel)]="cityDetailsReq.cityCategoryId" class="form-control">
                    <option value="0">--select--</option>
                    <option *ngFor="let o of cityCategory" [ngValue]="o.cityCategoryId">{{o.cityCatagoryName}}</option>
                  </select>
                </div>
              </div>
            </div>
  
          </div>
  
          <div class="row">
            <div class="col-md-12 text-right">
              <button type=" button" class="btn btn-default" (click)="cancelCity()">
                Cancel</button>&nbsp;
              <button type="button" class="btn btn-primary" (click)="postCity()">
                Save
              </button>
            </div>
          </div>
  
        </div>
      </div>
    </div>
  </div>
  <!-- City Ends-->
  
  <!-- bodingLodging_Details Model    by shagufta-->
  
  <div class="modal fade" bsModal #borloddtailModel="bs-modal"
    [config]="{backdrop: 'static'}" tabindex="-1" role="dialog">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h4 id="create-account" class="modal-title pull-left">{{heading}}</h4>
          <button type="button" class="close pull-right" aria-label="Close" (click)="borloddtailModel.hide()">
            <span aria-hidden="true">&times;</span>
          </button>
        </div>
        <div class="modal-body">
          <app-boding-lodging-da-detail [BordingRes]="response"></app-boding-lodging-da-detail>
        </div>
      </div>
    </div>
  </div>
