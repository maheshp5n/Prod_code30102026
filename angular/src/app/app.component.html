<router-outlet></router-outlet>


<div class="modal fade" bsModal #popupSuccessModel="bs-modal" [config]="{backdrop: 'static'}" tabindex="-1"
    role="dialog">
    <div [ngClass]="alertMeta.type" style="width:40%; text-align: center;margin: auto;">
        <button type="button" class="close pull-right" aria-label="Close" (click)="popupSuccessModel.hide()">
            <span aria-hidden="true">&times;</span>
        </button>
        <strong [innerHTML]="alertMeta.message"></strong>
    </div>
</div>

<div class="info-message" *ngIf="info.show" style=" position: fixed;
bottom: 20px;
right: 20px;
width: 500px;
border-radius: 5px;
background-color: rgba(0, 0, 0, .8);
display: flex;
flex-direction: row;
color: antiquewhite;
justify-content: space-between;
padding: 12px 6px;">
    <label style="padding: 3px;
    font-weight: 400;
    font-size: larger">
    {{info.message}}</label>
    <button class="clsb" (click)="info.show=!info.show" style="outline: none;
    border-radius: 50%;
    width: 15px;
    height: 15px;
    border-style: none;
    background-image: radial-gradient(lightgray 10%,red 80%);
    box-shadow: inset 0px 0px 2px #000000;">
    </button>
</div>
