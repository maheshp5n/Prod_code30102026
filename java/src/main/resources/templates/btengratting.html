<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="/assets/cssforext/style.css">
	<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css"
		integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
	<title>Feeback Form</title>
</head>

<body>
	<div class="main">

		<section class="row">
			<section class="col-12 col-sm col-md">
				<form method="post">
					<div class="logo">
						<img src="/assets/images/logo.png" alt="Exicom logo" />
					</div>
					<br>
					<div class="heading test-center"> SERVICE QUALITY FEEDBACK FORM</div>
					<br>
					<div class="content">
						<h5 class="cusName">Dear <span style="text-transform: capitalize;"
								th:text="${saData.acknowledgedByName}"></span>,</h5>
						<h7 class="subContent">
							We request to rate our engineer's service, through your feedback we shall be able to
							continually
							improve the service thereof.
						</h7>
					</div>
					<div class="generalinfo text-center my-txt">General Information</div>
					<div class="infromation">
						Service Appointment: <span th:text=""></span><br>
						Case Number: <span></span><br>
						Status: <span></span> <br>
						Created Date: <span></span><br>
						Engineer's Name: <span></span>

					</div>
					<div class=" eng-info text-center">
						<div class="my-txt text-center">Engineer Service Rating
						</div>
					</div>

					<center>
						<div class="fiveStar">
							<div class="rate ">
								<input type="hidden" name="vfd" th:value="${vfd}" />
								<input type="radio" id="star1" name="rate" value="5" />
								<label for="star1" title="text">1 star</label>
								<input type="radio" id="star2" name="rate" value="4" />
								<label for="star2" title="text">2 stars</label>
								<input type="radio" id="star3" name="rate" value="3" />
								<label for="star3" title="text">3 stars</label>
								<input type="radio" id="star4" name="rate" value="2" />
								<label for="star4" title="text">4 stars</label>
								<input type="radio" id="star5" name="rate" value="1" />
								<label for="star5" title="text">5 stars</label>
							</div>

						</div>
						<div>
							<span
								style="background-color: orange;border-radius: 50%;width: 30px;height: 30px;padding:3px;text-shadow: 1px 1px #FF0000;box-shadow: 2px 2px #888888;"><span
									id="inNumber">0</span>/5</span>
						</div>
					</center>
					<br>
					<div class="form-group comment ">

						<textarea class="form-control" name="remarks" id="exampleFormControlTextarea1" rows="2"
							placeholder="Comments"></textarea>
					</div>
					<div class="text-center">
						<button type="submit" class="btn btn-success">Submit</button>
					</div>

					<br>

				</form>
			</section>
		</section>

	</div>
	<script src="https://code.jquery.com/jquery-3.2.1.slim.min.js"
		integrity="sha384-KJ3o2DKtIkvYIK3UENzmM7KCkRr/rE9/Qpg6aAZGJwFDMVNA/GpGFF93hXpG5KkN"
		crossorigin="anonymous"></script>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.12.9/umd/popper.min.js"
		integrity="sha384-ApNbgh9B+Y1QKtv3Rn7W3mgPxhU9K/ScQsAP7hUibX39j7fakFPskvXusvfa0b4Q"
		crossorigin="anonymous"></script>
	<script>

		$(document).ready(function () {
			$('#star1').click(function () {
				console.log('data 1')
				$('#inNumber').text('5');
			});
			$('#star2').click(function () {
				console.log('data 2')
				$('#inNumber').text('4');
			});
			$('#star3').click(function () {
				console.log('data 3')
				$('#inNumber').text('3');
			});
			$('#star4').click(function () {
				console.log('data 4')
				$('#inNumber').text('2');
			});
			$('#star5').click(function () {
				console.log('data 5')
				$('#inNumber').text('1');
			});
		});

	</script>


</body>

</html>
